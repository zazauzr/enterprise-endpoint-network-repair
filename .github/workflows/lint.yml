  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Create dummy directories if they don't exist yet to prevent lint crash
      - name: Ensure target directories exist
        run: |
          mkdir -p playbooks scripts

      # Run Ansible Lint with non-blocking mode if directories are being populated
      - name: Run Ansible Lint
        uses: ansible/ansible-lint@v6
        continue-on-error: true
        with:
          args: playbooks/

      # Lint PowerShell Scripts
      - name: Run PowerShell Script Analyzer
        uses: microsoft/psscriptanalyzer-action@v1.1
        continue-on-error: true
        with:
          path: scripts/
